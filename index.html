<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeetCode Patterns</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --border: #2a2f3a; --text: #e6e8ec;
    --muted: #8b93a3; --accent: #ffa116; --link: #7cb7ff; --good: #2cbb5d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  .sub { color: var(--muted); margin: 0 0 20px; }

  nav { display: flex; gap: 8px; margin-bottom: 24px; }
  nav button {
    background: var(--card); color: var(--muted); border: 1px solid var(--border);
    font-weight: 500;
  }
  nav button.active { color: var(--text); border-color: var(--accent); }

  button {
    font: inherit; padding: 10px 14px; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #111; border: none; font-weight: 600;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost {
    background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 500;
  }

  .random {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; text-align: center; margin-bottom: 32px;
  }
  .random .num {
    font-size: 3.5rem; font-weight: 700; color: var(--accent);
    font-variant-numeric: tabular-nums; min-height: 1.2em;
  }
  .random .num a { color: inherit; text-decoration: none; }
  .random .num a:hover { text-decoration: underline; }
  .random .topic { color: var(--muted); min-height: 1.5em; margin-bottom: 16px; }
  .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .topic-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; margin-bottom: 12px;
  }
  .topic-card h2 { font-size: 1rem; margin: 0 0 8px; }
  .topic-card h2 span { color: var(--muted); font-weight: 400; margin-right: 6px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }

  .chip {
    display: inline-flex; align-items: stretch; border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden;
  }
  .chip a {
    color: var(--link); text-decoration: none; padding: 4px 10px;
    font-variant-numeric: tabular-nums;
  }
  .chip a:hover { background: rgba(124,183,255,.08); }
  .chip .cnt {
    padding: 4px 8px; color: var(--muted); border-left: 1px solid var(--border);
    font-variant-numeric: tabular-nums; min-width: 28px; text-align: center;
  }
  .chip.done { border-color: rgba(44,187,93,.5); }
  .chip.done .cnt { color: var(--good); }
  .chip.hit { border-color: var(--accent); }

  /* History */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
  }
  .stat .v { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: .85rem; }
  h3 { font-size: 1.05rem; margin: 28px 0 10px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: .92rem; }
  th { color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  td a { color: var(--link); text-decoration: none; }
  td.num { font-variant-numeric: tabular-nums; }
  td .del {
    background: transparent; color: var(--muted); border: none; padding: 0 6px; font-weight: 400;
  }
  td .del:hover { color: #ff6b6b; }
  .empty { color: var(--muted); padding: 16px; text-align: center; }
  .hist-actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  .note { color: var(--muted); font-size: .85rem; margin-top: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>LeetCode Patterns</h1>
  <p class="sub">27 patterns · click a number to open it · every click counts as an attempt</p>

  <nav>
    <button id="tabProblems" class="active">Problems</button>
    <button id="tabHistory">History</button>
  </nav>

  <div id="viewProblems">
    <section class="random">
      <div class="num" id="rNum">?</div>
      <div class="topic" id="rTopic">Hit the button to get a random problem number</div>
      <div class="controls">
        <button id="go">Random question</button>
      </div>
    </section>
    <main id="list"></main>
  </div>

  <div id="viewHistory" hidden>
    <div class="stats" id="stats"></div>

    <h3>Attempts per problem</h3>
    <div id="perProblem"></div>

    <h3>Recent activity</h3>
    <div id="recent"></div>

    <div class="hist-actions">
      <button class="ghost" id="exportBtn">Export JSON</button>
      <button class="ghost" id="importBtn">Import JSON</button>
      <button class="ghost" id="resetBtn">Reset history</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
    <p class="note">History is saved in this browser only. Use Export / Import to move it to another device.</p>
  </div>
</div>

<script>
const TOPICS = [
  ["Sliding Window", [3, 76, 209, 424, 567, 904]],
  ["Two Pointers", [11, 15, 16, 18, 42, 167]],
  ["Fast/Slow Pointers (Linked List)", [141, 142, 19, 876, 160, 234]],
  ["Binary Search on Sorted Data", [33, 34, 35, 153, 162, 704]],
  ["Binary Search on Answer", [875, 1011, 410, 774, 1283, 1482]],
  ["Hashing / Frequency Maps", [1, 49, 128, 217, 242, 347]],
  ["Prefix Sum / Running Sum", [303, 560, 724, 930, 974, 523]],
  ["Difference Array / Range Updates", [370, 1094, 1109, 1893, 1943, 2381]],
  ["Monotonic Stack", [739, 496, 503, 84, 85, 901]],
  ["Monotonic Queue / Deque", [239, 862, 1425, 1438, 1499, 1696]],
  ["Heap / Top K", [215, 347, 692, 703, 973, 1046]],
  ["Intervals", [56, 57, 252, 253, 435, 452]],
  ["Greedy Scheduling / Sorting", [45, 55, 406, 621, 763, 134]],
  ["Linked List Manipulation", [21, 23, 24, 25, 92, 138]],
  ["Tree DFS", [104, 112, 113, 543, 124, 226]],
  ["Tree BFS / Level Order", [102, 103, 199, 515, 637, 116]],
  ["BST Problems", [98, 99, 230, 235, 450, 700]],
  ["Backtracking Basics", [46, 47, 77, 78, 90, 39]],
  ["Backtracking with Constraints", [40, 17, 79, 131, 51, 52]],
  ["Graph BFS / DFS", [200, 695, 733, 994, 1091, 1254]],
  ["Topological Sort / DAG", [207, 210, 802, 1462, 1203, 2115]],
  ["Union Find / DSU", [547, 684, 1319, 1579, 990, 1202]],
  ["Shortest Path", [743, 787, 1514, 1631, 1334, 1976]],
  ["MST / Graph Greedy", [1584, 1135, 1168, 1489, 778, 1102]],
  ["Trie", [208, 211, 212, 648, 677, 1268]],
  ["Bit Manipulation", [136, 137, 191, 338, 268, 190]],
  ["1D DP Basics", [70, 198, 213, 322, 279, 300]],
];

// Problem number -> LeetCode URL slug
const SLUGS = {
  1:"two-sum",3:"longest-substring-without-repeating-characters",11:"container-with-most-water",
  15:"3sum",16:"3sum-closest",17:"letter-combinations-of-a-phone-number",18:"4sum",
  19:"remove-nth-node-from-end-of-list",21:"merge-two-sorted-lists",23:"merge-k-sorted-lists",
  24:"swap-nodes-in-pairs",25:"reverse-nodes-in-k-group",33:"search-in-rotated-sorted-array",
  34:"find-first-and-last-position-of-element-in-sorted-array",35:"search-insert-position",
  39:"combination-sum",40:"combination-sum-ii",42:"trapping-rain-water",45:"jump-game-ii",
  46:"permutations",47:"permutations-ii",49:"group-anagrams",51:"n-queens",52:"n-queens-ii",
  55:"jump-game",56:"merge-intervals",57:"insert-interval",70:"climbing-stairs",
  76:"minimum-window-substring",77:"combinations",78:"subsets",79:"word-search",
  84:"largest-rectangle-in-histogram",85:"maximal-rectangle",90:"subsets-ii",
  92:"reverse-linked-list-ii",98:"validate-binary-search-tree",99:"recover-binary-search-tree",
  102:"binary-tree-level-order-traversal",103:"binary-tree-zigzag-level-order-traversal",
  104:"maximum-depth-of-binary-tree",112:"path-sum",113:"path-sum-ii",
  116:"populating-next-right-pointers-in-each-node",124:"binary-tree-maximum-path-sum",
  128:"longest-consecutive-sequence",131:"palindrome-partitioning",134:"gas-station",
  136:"single-number",137:"single-number-ii",138:"copy-list-with-random-pointer",
  141:"linked-list-cycle",142:"linked-list-cycle-ii",153:"find-minimum-in-rotated-sorted-array",
  160:"intersection-of-two-linked-lists",162:"find-peak-element",
  167:"two-sum-ii-input-array-is-sorted",190:"reverse-bits",191:"number-of-1-bits",
  198:"house-robber",199:"binary-tree-right-side-view",200:"number-of-islands",
  207:"course-schedule",208:"implement-trie-prefix-tree",209:"minimum-size-subarray-sum",
  210:"course-schedule-ii",211:"design-add-and-search-words-data-structure",212:"word-search-ii",
  213:"house-robber-ii",215:"kth-largest-element-in-an-array",217:"contains-duplicate",
  226:"invert-binary-tree",230:"kth-smallest-element-in-a-bst",234:"palindrome-linked-list",
  235:"lowest-common-ancestor-of-a-binary-search-tree",239:"sliding-window-maximum",
  242:"valid-anagram",252:"meeting-rooms",253:"meeting-rooms-ii",268:"missing-number",
  279:"perfect-squares",300:"longest-increasing-subsequence",303:"range-sum-query-immutable",
  322:"coin-change",338:"counting-bits",347:"top-k-frequent-elements",370:"range-addition",
  406:"queue-reconstruction-by-height",410:"split-array-largest-sum",
  424:"longest-repeating-character-replacement",435:"non-overlapping-intervals",
  450:"delete-node-in-a-bst",452:"minimum-number-of-arrows-to-burst-balloons",
  496:"next-greater-element-i",503:"next-greater-element-ii",
  515:"find-largest-value-in-each-tree-row",523:"continuous-subarray-sum",
  543:"diameter-of-binary-tree",547:"number-of-provinces",560:"subarray-sum-equals-k",
  567:"permutation-in-string",621:"task-scheduler",637:"average-of-levels-in-binary-tree",
  648:"replace-words",677:"map-sum-pairs",684:"redundant-connection",692:"top-k-frequent-words",
  695:"max-area-of-island",700:"search-in-a-binary-search-tree",703:"kth-largest-element-in-a-stream",
  704:"binary-search",724:"find-pivot-index",733:"flood-fill",739:"daily-temperatures",
  743:"network-delay-time",763:"partition-labels",774:"minimize-max-distance-to-gas-station",
  778:"swim-in-rising-water",787:"cheapest-flights-within-k-stops",
  802:"find-eventual-safe-states",862:"shortest-subarray-with-sum-at-least-k",
  875:"koko-eating-bananas",876:"middle-of-the-linked-list",901:"online-stock-span",
  904:"fruit-into-baskets",930:"binary-subarrays-with-sum",973:"k-closest-points-to-origin",
  974:"subarray-sums-divisible-by-k",990:"satisfiability-of-equality-equations",
  994:"rotting-oranges",1011:"capacity-to-ship-packages-within-d-days",1046:"last-stone-weight",
  1091:"shortest-path-in-binary-matrix",1094:"car-pooling",1102:"path-with-maximum-minimum-value",
  1109:"corporate-flight-bookings",1135:"connecting-cities-with-minimum-cost",
  1168:"optimize-water-distribution-in-a-village",1202:"smallest-string-with-swaps",
  1203:"sort-items-by-groups-respecting-dependencies",1254:"number-of-closed-islands",
  1268:"search-suggestions-system",1283:"find-the-smallest-divisor-given-a-threshold",
  1319:"number-of-operations-to-make-network-connected",
  1334:"find-the-city-with-the-smallest-number-of-neighbors-at-a-threshold-distance",
  1425:"constrained-subsequence-sum",
  1438:"longest-continuous-subarray-with-absolute-diff-less-than-or-equal-to-limit",
  1462:"course-schedule-iv",1482:"minimum-number-of-days-to-make-m-bouquets",
  1489:"find-critical-and-pseudo-critical-edges-in-minimum-spanning-tree",
  1499:"max-value-of-equation",1514:"path-with-maximum-probability",
  1579:"remove-max-number-of-edges-to-keep-graph-fully-traversable",
  1584:"min-cost-to-connect-all-points",1631:"path-with-minimum-effort",1696:"jump-game-vi",
  1893:"check-if-all-the-integers-in-a-range-are-covered",1943:"describe-the-painting",
  1976:"number-of-ways-to-arrive-at-destination",2115:"find-all-possible-recipes-from-given-supplies",
  2381:"shifting-letters-ii"
};

const url = n => `https://leetcode.com/problems/${SLUGS[n]}/`;
const titleOf = n => SLUGS[n].split("-").map(w => w[0].toUpperCase() + w.slice(1)).join(" ");

// number -> topic name(s)
const TOPIC_OF = {};
TOPICS.forEach(([name, nums]) => nums.forEach(n => {
  TOPIC_OF[n] = TOPIC_OF[n] ? TOPIC_OF[n] + " / " + name : name;
}));
const ALL = Object.keys(TOPIC_OF).map(Number);

/* ---------- storage ---------- */
const KEY = "lc-patterns-history";
let history = [];   // [{ n: 560, t: 1731220000000 }, ...]
try { history = JSON.parse(localStorage.getItem(KEY)) || []; } catch { history = []; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(history)); } catch {} }

function counts() {
  const c = {};
  history.forEach(h => { c[h.n] = (c[h.n] || 0) + 1; });
  return c;
}

function logAttempt(n) {
  history.push({ n, t: Date.now() });
  save(); render();
}

/* ---------- problems view ---------- */
const list = document.getElementById("list");
TOPICS.forEach(([name, nums], i) => {
  const card = document.createElement("div");
  card.className = "topic-card";
  card.innerHTML = `<h2><span>${i + 1}.</span>${name}</h2><div class="links">` +
    nums.map(n => `<span class="chip" data-n="${n}">` +
      `<a class="plink" data-n="${n}" href="${url(n)}" target="_blank" rel="noopener" title="${titleOf(n)}">${n}</a>` +
      `<span class="cnt">0</span></span>`).join("") +
    `</div>`;
  list.appendChild(card);
});

// Any click on a problem link (left or middle click) logs an attempt
function onProblemClick(e) {
  const a = e.target.closest("a.plink");
  if (!a) return;
  if (e.type === "auxclick" && e.button !== 1) return;
  logAttempt(Number(a.dataset.n));
}
document.addEventListener("click", onProblemClick);
document.addEventListener("auxclick", onProblemClick);

let last = null;
document.getElementById("go").addEventListener("click", () => {
  let pick;
  do { pick = ALL[Math.floor(Math.random() * ALL.length)]; }
  while (ALL.length > 1 && pick === last);
  last = pick;

  document.getElementById("rNum").innerHTML =
    `<a class="plink" data-n="${pick}" href="${url(pick)}" target="_blank" rel="noopener">#${pick}</a>`;
  document.getElementById("rTopic").textContent = `${titleOf(pick)} · ${TOPIC_OF[pick]}`;

  document.querySelectorAll(".chip.hit").forEach(c => c.classList.remove("hit"));
  document.querySelectorAll(`.chip[data-n="${pick}"]`).forEach(c => c.classList.add("hit"));
});

/* ---------- history view ---------- */
const fmt = t => new Date(t).toLocaleString(undefined, {
  day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit"
});
const isToday = t => new Date(t).toDateString() === new Date().toDateString();

function render() {
  const c = counts();

  // counters on chips
  document.querySelectorAll(".chip").forEach(chip => {
    const v = c[chip.dataset.n] || 0;
    chip.querySelector(".cnt").textContent = v;
    chip.classList.toggle("done", v > 0);
  });

  // stats
  const tried = Object.keys(c).length;
  const today = history.filter(h => isToday(h.t)).length;
  const days = new Set(history.map(h => new Date(h.t).toDateString()));
  let streak = 0;
  const d = new Date();
  if (!days.has(d.toDateString())) d.setDate(d.getDate() - 1); // streak can continue from yesterday
  while (days.has(d.toDateString())) { streak++; d.setDate(d.getDate() - 1); }

  document.getElementById("stats").innerHTML = [
    [history.length, "Total attempts"],
    [`${tried} / ${ALL.length}`, "Problems tried"],
    [today, "Attempts today"],
    [streak, "Day streak"],
  ].map(([v, l]) => `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");

  // per-problem table
  const lastAt = {};
  history.forEach(h => { lastAt[h.n] = Math.max(lastAt[h.n] || 0, h.t); });
  const rows = Object.keys(c).map(Number).sort((a, b) => c[b] - c[a] || lastAt[b] - lastAt[a]);
  document.getElementById("perProblem").innerHTML = rows.length
    ? `<table><tr><th>#</th><th>Problem</th><th>Topic</th><th>Attempts</th><th>Last attempt</th></tr>` +
      rows.map(n => `<tr><td class="num"><a href="${url(n)}" target="_blank" rel="noopener">${n}</a></td>` +
        `<td>${titleOf(n)}</td><td>${TOPIC_OF[n]}</td><td class="num">${c[n]}</td>` +
        `<td>${fmt(lastAt[n])}</td></tr>`).join("") + `</table>`
    : `<table><tr><td class="empty">No attempts yet. Click a problem to start.</td></tr></table>`;

  // recent log
  const recent = history.map((h, i) => ({ ...h, i })).reverse().slice(0, 50);
  document.getElementById("recent").innerHTML = recent.length
    ? `<table><tr><th>When</th><th>#</th><th>Problem</th><th></th></tr>` +
      recent.map(h => `<tr><td>${fmt(h.t)}</td>` +
        `<td class="num"><a href="${url(h.n)}" target="_blank" rel="noopener">${h.n}</a></td>` +
        `<td>${titleOf(h.n)}</td>` +
        `<td style="text-align:right"><button class="del" data-i="${h.i}" title="Remove this entry">✕</button></td></tr>`).join("") +
      `</table>`
    : `<table><tr><td class="empty">Nothing here yet.</td></tr></table>`;
}

document.getElementById("recent").addEventListener("click", e => {
  if (e.target.classList.contains("del")) {
    history.splice(Number(e.target.dataset.i), 1);
    save(); render();
  }
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Delete all attempt history? This can't be undone.")) {
    history = []; save(); render();
  }
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(history, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "leetcode-history.json";
  a.click();
  URL.revokeObjectURL(a.href);
});

const importFile = document.getElementById("importFile");
document.getElementById("importBtn").addEventListener("click", () => importFile.click());
importFile.addEventListener("change", async () => {
  const f = importFile.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw 0;
    history = data.filter(h => SLUGS[h.n] && typeof h.t === "number");
    save(); render();
  } catch { alert("That file doesn't look like an exported history."); }
  importFile.value = "";
});

/* ---------- tabs ---------- */
const tabs = { Problems: document.getElementById("tabProblems"), History: document.getElementById("tabHistory") };
function show(name) {
  document.getElementById("viewProblems").hidden = name !== "Problems";
  document.getElementById("viewHistory").hidden = name !== "History";
  Object.entries(tabs).forEach(([k, b]) => b.classList.toggle("active", k === name));
}
tabs.Problems.addEventListener("click", () => show("Problems"));
tabs.History.addEventListener("click", () => show("History"));

render();
</script>
</body>
</html>
